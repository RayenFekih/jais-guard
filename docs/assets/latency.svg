· zero-shot generation</text><rect x="350" y="207" width="315.23837627523176" height="30" fill="#d1d1ce"/><text x="677.2383762752318" y="229" font-size="18" fill="#262626" font-weight="600">160.84 ms</text><text x="36" y="318" font-size="18" fill="#262626" font-weight="400">Frozen Backbone + Head</text><text x="36" y="343" font-size="13" fill="#686868" font-weight="400">Local GPU · v2 seed 43</text><rect x="350" y="299" width="46.05465464410372" height="30" fill="#d1d1ce"/><text x="408.0546546441037" y="321" font-size="18" fill="#262626" font-weight="600">23.50 ms</text><text x="36" y="410" font-size="18" fill="#262626" font-weight="600">LoRA + Head</text><text x="36" y="435" font-size="13" fill="#686868" font-weight="400">Local GPU · v2 seed 44</text><rect x="350" y="391" width="67.10907649248838" height="30" fill="#343f3c"/><text x="429.1090764924884" y="413" font-size="18" fill="#262626" font-weight="600">34.24 ms</text><text x="350" y="510" font-size="15" fill="#686868" font-weight="400">Mean latency (ms)</text><text x="36" y="552" font-size="14" fill="#686868" font-weight="400">Local: RTX 4050 Laptop GPU, 6 GB · batch 1 · tokenization and transfers included.</text><text x="36" y="577" font-size="14" fill="#686868" font-weight="400">Jev includes networking; different deployment paths preclude a controlled speed test.</text><text x="36" y="602" font-size="14" fill="#686868" font-weight="400">Local: 3 warmup inputs, no HTTP. Jev: no warmup. Loading excluded.</text><text x="36" y="627" font-size="14" fill="#686868" font-weight="400">Dark bar identifies the published LoRA checkpoint; frozen has the lowest latency.</text></g></svg>
