[project]
name = "jais-fine-tune"
version = "0.1.0"
description = "Arabic meaningful-text classification with Jais: training, evaluation and serving"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "torch>=2.14.1",
    "accelerate>=1.15.0",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "protobuf>=7.36.2",
    "datasets>=5.1.0",
    "evaluate>=0.4.6",
    "scikit-learn>=1.9.1",
    "pandas>=3.1.0",
    "numpy>=2.4.6",
    "tqdm>=4.70.1",
    "transformers==5.20.2",
    "huggingface-hub>=2.3.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
finetune = ["mlflow>=3.17.2,<4", "peft>=0.18,<1"]
annotation = [
    "streamlit==1.66.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires private artifacts or a cached upstream architecture"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jais_guard*"]

[project.scripts]
jaisguard = "jais_guard.cli:main"
